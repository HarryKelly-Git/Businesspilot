<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons. iOS Safari ignores SVG icons entirely, which is why the icon
         was missing on mobile — it needs a PNG apple-touch-icon. Android/Chrome
         reads the manifest; desktop uses the SVG; .ico covers older browsers. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="BusinessPilot" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="BusinessPilot AI - Your AI Employee That Never Misses A Lead. Automatically follow up enquiries, recover missed calls, book appointments, and grow your business." />
    <meta name="theme-color" content="#2d3748" />

    <!-- Open Graph -->
    <meta property="og:title" content="BusinessPilot AI - Your AI Employee That Never Misses A Lead" />
    <meta property="og:description" content="Automatically follow up enquiries, recover missed calls, book appointments, and grow your business." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thebusinesspilot.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BusinessPilot AI - Your AI Employee That Never Misses A Lead" />
    <meta name="twitter:description" content="Automatically follow up enquiries, recover missed calls, book appointments, and grow your business." />

    <!-- Fonts (loaded non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>

    <title>BusinessPilot AI - Your AI Employee That Never Misses A Lead</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
